name: Build Ember

# Builds and publishes a release. The emulator checks already ran on this exact code in
# the full preview run before release (see preview.yml), so they aren't repeated here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Release number (carries on from Ember-19 in the old repo)
        run: echo "EMBER_BUILD=$(( ${{ github.run_number }} + 19 ))" >> $GITHUB_ENV

      - name: Signing key (from the repo's secrets)
        env:
          KEY_B64: ${{ secrets.EMBER_KEYSTORE_B64 }}
        run: |
          echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/ember.jks"
          echo "EMBER_KEYSTORE_PATH=$RUNNER_TEMP/ember.jks" >> $GITHUB_ENV

      - name: Build APK
        env:
          EMBER_STORE_PASSWORD: ${{ secrets.EMBER_STORE_PASSWORD }}
          EMBER_KEY_PASSWORD: ${{ secrets.EMBER_KEY_PASSWORD }}
        run: |
          set -o pipefail
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle :app:assembleRelease :wear:assembleRelease --no-daemon --console=plain 2>&1 | tee build.log

      - name: Save build log on failure
        if: failure()
        run: |
          touch build.log
          grep -E "^e: |error:|What went wrong" -A2 build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done || true
          git config user.name "ember-ci"
          git config user.email "ci@users.noreply.github.com"
          mkdir -p /tmp/logs && cp build.log /tmp/logs/build-${{ env.EMBER_BUILD }}.log
          git checkout --orphan ci-logs
          git rm -rf --cached . > /dev/null
          git clean -fdq
          mkdir -p logs && cp /tmp/logs/*.log logs/
          git add logs
          git commit -qm "Build log ${{ env.EMBER_BUILD }}"
          git push -f origin ci-logs

      - name: Name the APKs
        run: |
          # Phones get the arm64 build (smaller); the emulator test uses x86_64.
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk Ember-${{ env.EMBER_BUILD }}.apk
          cp wear/build/outputs/apk/release/wear-release.apk Ember-Watch-${{ env.EMBER_BUILD }}.apk
          mkdir -p emulator && cp app/build/outputs/apk/release/app-x86_64-release.apk emulator/Ember-${{ env.EMBER_BUILD }}.apk
          ls -la *.apk emulator/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Ember-emulator
          path: emulator/Ember-*.apk
          retention-days: 90

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.EMBER_BUILD }}
          name: Ember build ${{ env.EMBER_BUILD }}
          files: |
            Ember-${{ env.EMBER_BUILD }}.apk
            Ember-Watch-${{ env.EMBER_BUILD }}.apk
          make_latest: true

