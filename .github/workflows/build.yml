name: Build Ember

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Release number (carries on from Ember-19 in the old repo)
        run: echo "EMBER_BUILD=$(( ${{ github.run_number }} + 19 ))" >> $GITHUB_ENV

      - name: Signing key (from the repo's secrets)
        env:
          KEY_B64: ${{ secrets.EMBER_KEYSTORE_B64 }}
        run: |
          echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/ember.jks"
          echo "EMBER_KEYSTORE_PATH=$RUNNER_TEMP/ember.jks" >> $GITHUB_ENV

      - name: Build APK
        env:
          EMBER_STORE_PASSWORD: ${{ secrets.EMBER_STORE_PASSWORD }}
          EMBER_KEY_PASSWORD: ${{ secrets.EMBER_KEY_PASSWORD }}
        run: |
          set -o pipefail
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle :app:assembleRelease :wear:assembleRelease --no-daemon --console=plain 2>&1 | tee build.log

      - name: Save build log on failure
        if: failure()
        run: |
          touch build.log
          grep -E "^e: |error:|What went wrong" -A2 build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done || true
          git config user.name "ember-ci"
          git config user.email "ci@users.noreply.github.com"
          mkdir -p /tmp/logs && cp build.log /tmp/logs/build-${{ env.EMBER_BUILD }}.log
          git checkout --orphan ci-logs
          git rm -rf --cached . > /dev/null
          git clean -fdq
          mkdir -p logs && cp /tmp/logs/*.log logs/
          git add logs
          git commit -qm "Build log ${{ env.EMBER_BUILD }}"
          git push -f origin ci-logs

      - name: Name the APKs
        run: |
          # Phones get the arm64 build (smaller); the emulator test uses x86_64.
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk Ember-${{ env.EMBER_BUILD }}.apk
          cp wear/build/outputs/apk/release/wear-release.apk Ember-Watch-${{ env.EMBER_BUILD }}.apk
          mkdir -p emulator && cp app/build/outputs/apk/release/app-x86_64-release.apk emulator/Ember-${{ env.EMBER_BUILD }}.apk
          ls -la *.apk emulator/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Ember-emulator
          path: emulator/Ember-*.apk
          retention-days: 90

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.EMBER_BUILD }}
          name: Ember build ${{ env.EMBER_BUILD }}
          files: |
            Ember-${{ env.EMBER_BUILD }}.apk
            Ember-Watch-${{ env.EMBER_BUILD }}.apk
          make_latest: true

  smoke:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: Ember-emulator

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Make demo audio
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          ffmpeg -loglevel error -f lavfi -i "sine=frequency=220:duration=900" -c:a aac -b:a 64k demo.m4a
          ls -la demo.m4a Ember-*.apk

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none -no-audio -no-metrics
          script: bash ci/smoke.sh Ember-${{ env.EMBER_BUILD }}.apk

      - name: Save results
        if: always()
        run: |
          git config user.name "ember-ci"
          git config user.email "ci@users.noreply.github.com"
          mkdir -p /tmp/smoke && cp -r smoke-out/. /tmp/smoke/ 2>/dev/null || true
          git fetch -q origin ci-logs || true
          if git rev-parse -q --verify origin/ci-logs > /dev/null; then git checkout -q -B ci-logs origin/ci-logs; else git checkout -q --orphan ci-logs; git rm -rfq --cached . ; fi
          git clean -fdq -e Ember-*.apk
          rm -rf smoke && mkdir -p smoke/${{ env.EMBER_BUILD }} && cp -r /tmp/smoke/. smoke/${{ env.EMBER_BUILD }}/
          git add smoke
          git commit -qm "Smoke test ${{ env.EMBER_BUILD }}" || true
          git push -q -f origin ci-logs
