# Ember for iPhone and iPad. The Xcode project is generated from this file in CI (XcodeGen),
# so there's no .xcodeproj to keep in sync by hand.
name: Ember
options:
  bundleIdPrefix: app.ember
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  GoogleCast:
    url: https://github.com/googlecast/google-cast-ios-sdk
    from: 4.8.6
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Signing happens on the phone (SideStore signs with your Apple ID), not here.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    DEVELOPMENT_TEAM: ""
targets:
  Ember:
    type: application
    platform: iOS
    sources:
      - path: Ember
      - path: Shared
    dependencies:
      - package: GoogleCast
        product: GoogleCastDynamic
      - target: EmberWidgets
    entitlements:
      path: Ember/Ember.entitlements
      properties:
        com.apple.security.application-groups: [group.app.ember.audiobooks]
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Ember/Ember-Bridging-Header.h
        PRODUCT_BUNDLE_IDENTIFIER: app.ember.audiobooks
        PRODUCT_NAME: Ember
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        # Google sign-in (Drive books and sync): the iOS OAuth client's id and its reversed form.
        EMBER_GOOGLE_CLIENT_ID: "201241191505-fjf2d2tuq040kr6g6hatuo3qtekckunl.apps.googleusercontent.com"
        EMBER_GOOGLE_SCHEME: "com.googleusercontent.apps.201241191505-fjf2d2tuq040kr6g6hatuo3qtekckunl"
    info:
      path: Ember/Info.plist
      properties:
        CFBundleDisplayName: Ember
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIBackgroundModes: [audio, fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [app.ember.refresh]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: Pick a photo for your profile.
        NSPhotoLibraryAddUsageDescription: Save quote cards and recaps to your photos.
        NSMotionUsageDescription: Flip to pause notices when you put your phone face down.
        NSLocalNetworkUsageDescription: Ember looks for Chromecasts on your Wi-Fi and shares the book you cast with it.
        NSBonjourServices: [_googlecast._tcp, _CC1AD845._googlecast._tcp]
        GoogleClientID: "$(EMBER_GOOGLE_CLIENT_ID)"
        CFBundleURLTypes:
          - CFBundleURLName: app.ember.google
            CFBundleURLSchemes: ["$(EMBER_GOOGLE_SCHEME)"]
  EmberWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    entitlements:
      path: Widgets/EmberWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.app.ember.audiobooks]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ember.audiobooks.widgets
        PRODUCT_NAME: EmberWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
        SKIP_INSTALL: YES
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Ember
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  EmberTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EmberTests
    dependencies:
      - target: Ember
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ember.audiobooks.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Ember.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Ember"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Ember:
    build:
      targets:
        Ember: all
        EmberTests: [test]
    test:
      targets:
        - EmberTests
